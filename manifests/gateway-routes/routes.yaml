apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: petclinic
  namespace: petclinic
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - petclinic.localhost
  rules:
    - backendRefs:
        - name: petclinic
          port: 80
---
